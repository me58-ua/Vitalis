name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"    

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@localhost:5432/vitalis_ci
      JWT_SECRET_KEY: ci-only-secret-key
      ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/dependencies.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r dependencies.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests -v
